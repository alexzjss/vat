name: Build e Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Importar projeto
        run: |
          godot --headless --path game --import || true
          godot --headless --path game --import
      - name: Testes (GUT)
        run: godot --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit

  export:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot e templates de exportação
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Importar projeto
        run: |
          godot --headless --path game --import || true
          godot --headless --path game --import
      - name: Exportar Windows e Linux
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path game --export-release "Windows Desktop" ../build/windows/VAT-RPG.exe
          godot --headless --path game --export-release "Linux" ../build/linux/VAT-RPG.x86_64
          chmod +x build/linux/VAT-RPG.x86_64
      - name: Empacotar
        run: |
          name="VAT-RPG-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          (cd build/windows && zip -r "../../dist/${name}-windows.zip" .)
          tar -czf "dist/${name}-linux-x86_64.tar.gz" -C build/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: VAT-RPG
          path: dist/*
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
